<!doctype html>
<!--
  The social card: the GitHub social preview (1280 x 640) and the Open Graph image (1200 x 630).
  scripts/brand.mjs opens this file at each size and captures it; the layout follows the viewport.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Nocturne social card</title>
<style>
  @font-face {
    font-family: "Newsreader";
    font-style: normal;
    font-weight: 200 800;
    src: url("../assets/fonts/newsreader-latin-opsz-normal.woff2") format("woff2-variations");
  }
  @font-face {
    font-family: "Newsreader";
    font-style: italic;
    font-weight: 200 800;
    src: url("../assets/fonts/newsreader-latin-wght-italic.woff2") format("woff2-variations");
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 400;
    src: url("../assets/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "IBM Plex Mono";
    font-weight: 400;
    src: url("../assets/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
  }

  /* The landing page's dark tokens: night around the morning page. Sizes are in --u, one pixel
     of the 1280-wide preview, so the 1200-wide Open Graph image keeps the same proportions. */
  :root {
    --u: calc(100vw / 1280);
    --bg: #0e1014;
    --ink: #ece8df;
    --ink2: #aba79e;
    --ink3: #8a877f;
    --serif: "Newsreader", Georgia, serif;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    position: relative;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* Everything that carries meaning sits inside GitHub's central 1100 x 540. */
  .text {
    position: absolute;
    top: calc(var(--u) * 78);
    bottom: calc(var(--u) * 74);
    left: calc(var(--u) * 92);
    width: calc(var(--u) * 600);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: calc(var(--u) * 16);
    font-family: var(--serif);
    font-weight: 500;
    font-size: calc(var(--u) * 44);
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .brand svg {
    width: calc(var(--u) * 46);
    height: calc(var(--u) * 46);
  }

  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: calc(var(--u) * 72);
    line-height: 1.04;
    letter-spacing: -0.02em;
  }

  h1 em {
    color: var(--ink2);
  }

  .what {
    margin: calc(var(--u) * 26) 0 0;
    max-width: 24em;
    font-size: calc(var(--u) * 27);
    line-height: 1.38;
    color: var(--ink2);
    text-wrap: balance;
  }

  .foot {
    margin: 0;
    font-family: var(--mono);
    font-size: calc(var(--u) * 19);
    color: var(--ink3);
  }

  .foot span + span::before {
    content: "\00b7";
    margin: 0 0.6em;
  }

  /* The morning page, from the app with demo data, coming in from the bottom right corner. */
  .sheet {
    position: absolute;
    left: calc(var(--u) * 768);
    top: calc(var(--u) * 96);
    bottom: 0;
    width: calc(var(--u) * 600);
    overflow: hidden;
    border-radius: calc(var(--u) * 14) 0 0 0;
    background: #fbfaf6;
    box-shadow: 0 0 0 1px rgba(236, 232, 223, 0.08), 0 30px 90px -30px rgba(0, 0, 0, 0.8);
  }

  .sheet img {
    display: block;
    width: 100%;
    margin-top: calc(var(--u) * -18);
    margin-left: calc(var(--u) * -12);
  }
</style>
</head>
<body>
  <div class="text">
    <div class="brand">
      <svg viewBox="47 47 162 162" aria-hidden="true">
        <circle cx="128" cy="128" r="76" fill="#ece8df"/>
        <path d="M52 128a76 76 0 0 0 152 0z" fill="#0e1014"/>
        <circle cx="128" cy="128" r="76" fill="none" stroke="#ece8df" stroke-width="10"/>
      </svg>
      <span>Nocturne</span>
    </div>
    <div>
      <h1>It sleeps on it.<br><em>You wake to one page.</em></h1>
      <p class="what">A household’s letters, calls and messages, on one page each morning.</p>
    </div>
    <p class="foot"><span>Free and open source</span><span>nocturne.is</span></p>
  </div>
  <div class="sheet">
    <img src="../assets/img/page-light-1120.webp" alt="">
  </div>
</body>
</html>
