[package]
name = "nocturne-lemonade"
description = "Runs and supervises the private Lemonade server and implements the Nocturne mind over it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The fake lemond used by tests in this crate and in crates that depend on it.
fake-server = ["dep:axum"]
# Lets the online route reach the stand-in provider over plain HTTP on loopback. Tests, the
# network check and the S1 measurement only: never in `default`, never packaged.
online-stand-in = []
# Lets `NOCTURNE_TEST_SAMPLING` set how each job picks its words, for the sampling sweep. Read
# only in debug builds; never in `default`, never packaged.
test-sampling = []

[[bin]]
name = "fake-lemond"
path = "src/bin/fake-lemond.rs"
required-features = ["fake-server"]

[[bin]]
name = "fake-provider"
path = "src/bin/fake-provider.rs"
required-features = ["fake-server"]

[[bin]]
name = "supervisor-host"
path = "src/bin/supervisor-host.rs"
required-features = ["fake-server"]

[dependencies]
dunce.workspace = true
nocturne-contract.workspace = true
nocturne-engine.workspace = true
nocturne-mind.workspace = true
nocturne-provider.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
jiff.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net", "signal"] }
reqwest.workspace = true
# Picks the ring provider for the clients reqwest builds here.
rustls.workspace = true
process-wrap = { version = "10", features = ["tokio1"] }
getrandom = "0.4"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
base64 = "0.23"
futures-util = "0.3"
bytes = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pdf-extract = "0.12"
lopdf = { version = "0.47", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
axum = { version = "0.8", optional = true, features = ["multipart"] }
zeroize = "1"
url.workspace = true

# Core dumps off for the app and the engine, which may hold the Online answers key.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", default-features = false, features = ["resource", "process"] }

# The flag that starts a program without a console window, in the type the job object takes. The
# version moves with the one process-wrap uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
nocturne-lemonade = { workspace = true, features = ["fake-server"] }
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
