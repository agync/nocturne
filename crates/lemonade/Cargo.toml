[package]
name = "nocturne-lemonade"
description = "Runs and supervises the private Lemonade server and implements the Nocturne mind over it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The fake lemond used by tests in this crate and in crates that depend on it.
fake-server = ["dep:axum"]

[[bin]]
name = "fake-lemond"
path = "src/bin/fake-lemond.rs"
required-features = ["fake-server"]

[[bin]]
name = "supervisor-host"
path = "src/bin/supervisor-host.rs"
required-features = ["fake-server"]

[dependencies]
nocturne-contract.workspace = true
nocturne-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
jiff.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net", "signal"] }
reqwest.workspace = true
process-wrap = { version = "10", features = ["tokio1"] }
getrandom = "0.3"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
base64 = "0.22"
futures-util = "0.3"
bytes = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.39"
axum = { version = "0.8", optional = true, features = ["multipart"] }

[dev-dependencies]
nocturne-lemonade = { workspace = true, features = ["fake-server"] }
tempfile.workspace = true

[lints]
workspace = true
