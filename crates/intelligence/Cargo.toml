[package]
name = "nocturne-intelligence"
description = "Nocturne's intelligence layer: the reader, the overnight tidy, the scheduler and the host (power, idle, sleep)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nocturne-contract.workspace = true
nocturne-engine.workspace = true
jiff.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true
tokio-util = { version = "0.7", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Power", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_Foundation"] }

[features]
# A mutable fake host and a recording event sink for tests in this crate and above it.
fake = []

[dev-dependencies]
nocturne-intelligence = { path = ".", features = ["fake"] }
nocturne-engine = { workspace = true, features = ["fake"] }
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }

# The workspace forbids unsafe code; the Windows host must call Win32, so this crate denies it
# instead and allows it in `host/windows.rs` only.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
