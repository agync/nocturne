[package]
name = "nocturne-app"
description = "The Nocturne desktop shell: Tauri commands and events over the memory engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"
default-run = "nocturne-app"

[lib]
name = "nocturne_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nocturne-app"
path = "src/main.rs"

[[bin]]
name = "nocturne-preview"
path = "src/bin/nocturne-preview.rs"
required-features = ["preview"]

[[test]]
name = "preview"
required-features = ["preview"]

[features]
# A scripted mind (`NOCTURNE_FAKE_MIND=1`) for development only: add `--features fake-mind` to
# a dev run (`cargo tauri dev --features fake-mind`). Off by default, and ignored in release
# builds even when on. Tests build their own minds from the engine's `fake` feature.
default = []
fake-mind = ["nocturne-engine/fake"]
# A development-only server that puts the real app (engine, models, commands) behind HTTP on
# loopback, for use from a browser. Never in `default`, never built by packaging; the package
# checks fail if it shows up. See docs/contribution/building.md.
preview = ["tauri/test", "dep:axum", "dep:tower", "dep:tower-http", "dep:futures-util"]
# Set by `cargo tauri build`: embed the interface instead of loading the dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }
serde_json.workspace = true

[dependencies]
nocturne-contract.workspace = true
nocturne-engine.workspace = true
nocturne-intelligence = { path = "../crates/intelligence" }
nocturne-lemonade.workspace = true
tauri = { workspace = true, features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-single-instance.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
# Registered by the OS integration lane; the dependencies are here so it only wires them.
tauri-plugin-notification.workspace = true
tauri-plugin-global-shortcut.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
jiff.workspace = true
thiserror.workspace = true
getrandom = "0.3"
notify = "8"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tokio-util = { version = "0.7", default-features = false }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio", "json", "query"] }
tower = { version = "0.5", optional = true, features = ["util"] }
tower-http = { version = "0.6", optional = true, default-features = false, features = ["fs"] }
futures-util = { version = "0.3", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# Windows starts at login through the plugin; Linux and macOS write their own entry.
[target.'cfg(windows)'.dependencies]
tauri-plugin-autostart.workspace = true

[dev-dependencies]
tempfile.workspace = true
nocturne-engine = { workspace = true, features = ["fake"] }
nocturne-intelligence = { path = "../crates/intelligence", features = ["fake"] }
nocturne-lemonade = { workspace = true, features = ["fake-server"] }
tauri = { workspace = true, features = ["test"] }
reqwest.workspace = true
http-body-util = "0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
