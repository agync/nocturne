# Pinned connection helpers for Away from home. Update deliberately with scripts/helpers-pin.sh,
# which prints the checksums and captures the help text under crates/helpers/fixtures/help.
#
# placeholder = true marks a helper whose checksums have not been pinned yet. Nothing downloads
# or starts from a placeholder pin, and scripts/check-package.sh refuses it in a release.
# Platform keys match lemonade.lock. size is the exact byte size of the download (0 while it is
# a placeholder); redirect_hosts lists the only hosts a download may be redirected to, over https.
# For an archive, sha256 covers the download, member names the binary inside it and
# member_sha256 covers that binary.

[[helpers]]
kind = "cloudflared"
version = "2026.11.0"
licence = "Apache-2.0"
pinned_at = "2026-11-13"
# The upstream release date; a release build refuses a pin whose release is older than 183 days.
released_at = "2026-11-12"
base_url = "https://github.com/cloudflare/cloudflared/releases/download/2026.11.0"
redirect_hosts = ["release-assets.githubusercontent.com"]

[helpers.assets.linux-x86_64]
file = "cloudflared-linux-amd64"
sha256 = "51f7c68b57ed7269164075d7e789efce5b59355982f06392deeb037d982a51fd"
size = 40283099

[helpers.assets.linux-aarch64]
file = "cloudflared-linux-arm64"
sha256 = "abe54a006acf9faf2d19ee9d953cb0d0804e92f59c5382a162e57b84d086f56f"
size = 37668707

# Cloudflare signs and repackages this archive after it posts its checksums, so the posted value
# for the .tgz is the sha256 of the binary inside, which is member_sha256.
[helpers.assets.macos-aarch64]
file = "cloudflared-darwin-arm64.tgz"
sha256 = "8c2f90277ef06a6080bb40b964d33f09f1188102f8798f2e344174b6cf41accf"
size = 19890696
member = "cloudflared"
member_sha256 = "97e24268d9704a570fab276293028f3580ae2c7d5d2678621a4809e90f776a5e"

[helpers.assets.windows-x86_64]
file = "cloudflared-windows-amd64.exe"
sha256 = "d5c1d82031da6253dcdcff64c944cd0fe063016edeb2e4fd088075fc9bd52d0a"
size = 55397592

[[helpers]]
kind = "tailnet"
# Built by Nocturne from helpers/tailnet (scripts/build-tailnet.sh, the tailnet CI workflow) with
# the pinned Go toolchain; version is the tailscale.com module it is built on. Every platform is a
# bare binary attached to Nocturne's own release, whose address is filled in when the first release
# is cut.
version = "1.104.6"
licence = "BSD-3-Clause"
pinned_at = "2026-11-13"
# The tailscale v1.104.6 tag date. The checksums and sizes are of two identical builds with
# scripts/build-tailnet.sh. base_url and go_licenses_version stay placeholders until the first
# release exists, so this pin stays a placeholder.
released_at = "2026-11-10"
source = "helpers/tailnet"
go_version = "go1.27.3"
go_licenses_version = "PLACEHOLDER"
base_url = "https://example.invalid/nocturne/releases/download/PLACEHOLDER"
placeholder = true
redirect_hosts = ["objects.githubusercontent.com", "release-assets.githubusercontent.com"]

[helpers.assets.linux-x86_64]
file = "nocturne-tailnet-linux-x86_64"
sha256 = "9dd0880de029e6856e9a7476dd5578e8aea74865e1abb79172b9db76c2b83d8e"
size = 19218556

[helpers.assets.linux-aarch64]
file = "nocturne-tailnet-linux-aarch64"
sha256 = "df0f7014dd2eafd465c29000e95bb155e06712a590c7169a15583b11d3155fa9"
