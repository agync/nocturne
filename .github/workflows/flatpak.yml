# Builds the Nocturne Flatpak with AetherPak and, when asked, publishes it: the app goes to GHCR as
# OCI images and the repository index to https://flatpak.nocturne.is. Run by hand, or called by
# the release workflow with channel stable and publish true. See docs/contribution/flatpak.md.
#
# The privileged build sees no secret. The unprivileged jobs that hold the signing key publish
# with the AetherPak publish actions.
name: flatpak

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to build (empty for the selected branch)
        type: string
        default: ''
      channel:
        description: Flatpak branch to build for
        type: choice
        options: [beta, stable]
        default: beta
      publish:
        description: Push the images and deploy the repository index
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: The commit to build, a full SHA (empty for the calling ref)
        type: string
        default: ''
      tag:
        description: The release tag that ref was resolved from, required to publish to stable
        type: string
        default: ''
      channel:
        description: Flatpak branch to build for (stable or beta)
        type: string
        default: stable
      publish:
        description: Push the images and deploy the repository index
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flatpak-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  # Every job builds the commit resolved here, never a name. Publishing to stable needs a release
  # tag that points at that commit.
  resolve:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - id: resolve
        env:
          REF: ${{ inputs.ref }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref=${REF:-$GITHUB_SHA}
          case "$ref" in
            -* | refs/* | */refs/* | *..* | *[[:space:]]* )
              echo "refusing the ref: $ref" >&2; exit 1 ;;
          esac
          peel() {
            local refs
            refs=$(git ls-remote origin "refs/tags/$1" "refs/tags/$1^{}")
            awk -v r="refs/tags/$1^{}" '$2 == r { print $1 }' <<< "$refs" | head -n1 \
              | grep . || awk -v r="refs/tags/$1" '$2 == r { print $1 }' <<< "$refs" | head -n1
          }
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            sha=$ref
          else
            sha=$(peel "$ref" || true)
            if [ -z "$sha" ]; then
              sha=$(git ls-remote origin "refs/heads/$ref" \
                | awk -v r="refs/heads/$ref" '$2 == r { print $1 }' | head -n1)
            fi
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "cannot resolve $ref" >&2; exit 1; }
          if [ "$PUBLISH" = true ] && [ "$CHANNEL" = stable ]; then
            tag=${TAG:-$ref}
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "stable is published only from a v* release tag, not $tag" >&2; exit 1; }
            [ "$(peel "$tag" || true)" = "$sha" ] \
              || { echo "$tag does not point at $sha" >&2; exit 1; }
            # The commit must already be on main: a tag on a side branch is never built or signed.
            mainsha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            onmain=$(gh api "repos/$GITHUB_REPOSITORY/compare/$mainsha...$sha" --jq .status)
            case "$onmain" in
              identical | behind) ;;
              *) echo "$sha is not on main (compare says $onmain)" >&2; exit 1 ;;
            esac
          fi
          echo "building $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  sources:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The generators run once per build and the repository has no Python lockfile to key a cache on.
          enable-cache: false
      - name: offline cargo and npm sources
        run: scripts/flatpak-sources.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-generated
          path: flatpak/generated
          if-no-files-found: error

  # Privileged, and sees no secret. It builds the unsigned repository and hands it on.
  # The AetherPak build action runs unpinned setup-cli and cache actions from inside this job,
  # which is why nothing secret is reachable from here; the cache is off when publishing.
  # Each architecture builds natively on its own runner. The builder image digest is a
  # multi-architecture index (amd64 and arm64), so the same pin runs on both.
  build:
    needs: [resolve, sources]
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    container:
      image: ghcr.io/aetherpak/cli@sha256:588c847bbc7f56ad19730cb2980d16030be2cc147576fcf7ff3e92d193111c33 # latest-builder as of 2026-11-14
      options: --privileged
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-generated
          path: flatpak/generated
      - name: build
        uses: aetherpak/actions/build@d3803c8feb52143ebb13c8909d2d2a7364eeddef # v3.14.0
        with:
          config: flatpak/aetherpak.yaml
          app-id: is.nocturne.Nocturne
          branch: ${{ inputs.channel }}
          arch: ${{ matrix.arch }}
          repo-path: _repo
          cache: ${{ !inputs.publish }}
          upload-bundle: ${{ !inputs.publish }}
      - name: pack the repository
        if: inputs.publish
        run: tar -cf repo.tar _repo
      - if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-repo-${{ matrix.arch }}
          path: repo.tar
          if-no-files-found: error

  # Signs and pushes the images, one architecture per job, each writing its own record. Not
  # privileged. Pushing only copies the built repository into the registry, so both run on x86_64,
  # as AetherPak's own publish workflow does; the site job then merges the records into one index.
  publish:
    needs: [resolve, build]
    if: inputs.publish
    name: publish (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-repo-${{ matrix.arch }}
      - name: unpack the repository
        run: tar -xf repo.tar
      - name: require the signing key
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          [ -n "$GPG_KEY" ] || { echo "FLATPAK_GPG_PRIVATE_KEY is empty: refusing to publish unsigned" >&2; exit 1; }
      - name: sign and push the images
        uses: aetherpak/actions/publish-oci@d3803c8feb52143ebb13c8909d2d2a7364eeddef # v3.14.0
        with:
          registry: ghcr.io
          oci-repository: agync/nocturne-flatpak
          repo-path: _repo
          records-dir: _records
          app-id: is.nocturne.Nocturne
          branch: ${{ inputs.channel }}
          arch: ${{ matrix.arch }}
          signing: gpg
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          gpg-private-key-passphrase: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
      # The index is assembled in a separate job, so each build's record travels as an artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-records-${{ matrix.arch }}
          path: _records
          if-no-files-found: error

  site:
    needs: [resolve, publish]
    if: inputs.publish
    runs-on: ubuntu-24.04
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flatpak-records-*
          path: _records
          merge-multiple: true
      - name: require the signing key
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          [ -n "$GPG_KEY" ] || { echo "FLATPAK_GPG_PRIVATE_KEY is empty: refusing to publish unsigned" >&2; exit 1; }
      - name: repository index
        uses: aetherpak/actions/publish-site@d3803c8feb52143ebb13c8909d2d2a7364eeddef # v3.14.0
        with:
          config: flatpak/aetherpak.yaml
          records-dir: _records
          pages-url: https://flatpak.nocturne.is
          site-dir: _site
          remote-name: nocturne
          landing-page: true
          runtime-repo: https://dl.flathub.org/repo/flathub.flatpakrepo
          signing: gpg
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          gpg-private-key-passphrase: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
          upload-pages-artifact: false
      - name: keep the custom domain
        run: echo flatpak.nocturne.is > _site/CNAME
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-site
          path: _site
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: site
    if: inputs.publish
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://flatpak.nocturne.is/
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-site
          path: _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
