# Builds tailscaled and tailscale for macOS and Windows from the pinned upstream tag, for Away from
# home (Most private). Run by hand or on a release. Two independent builds must agree on the
# checksums before the signed programs are packaged and attached to the release.
name: tailscaled

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

env:
  TAILSCALED_GO_VERSION: ${{ vars.TAILSCALED_GO_VERSION }}
  TAILSCALED_TAG_COMMIT: ${{ vars.TAILSCALED_TAG_COMMIT }}
  TAILSCALED_GO_LICENSES_VERSION: ${{ vars.TAILSCALED_GO_LICENSES_VERSION }}

jobs:
  build:
    name: build ${{ matrix.target }} (${{ matrix.copy }})
    strategy:
      fail-fast: true
      matrix:
        target: [darwin-arm64, windows-amd64]
        # The two copies run on different machines, in different folders.
        copy: [first, second]
        include:
          - copy: first
            runs-on: ubuntu-24.04
          - copy: second
            runs-on: ubuntu-22.04
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ vars.TAILSCALED_GO_VERSION }}
          cache: false
      - run: scripts/build-tailscaled.sh build ${{ matrix.target }} "$RUNNER_TEMP/${{ matrix.copy }}"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.target }}-${{ matrix.copy }}
          path: ${{ runner.temp }}/${{ matrix.copy }}/${{ matrix.target }}/unsigned

  reproduce:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [darwin-arm64, windows-amd64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-${{ matrix.target }}-*
      - name: the two builds agree
        run: |
          set -euo pipefail
          diff "unsigned-${{ matrix.target }}-first/SHA256SUMS" "unsigned-${{ matrix.target }}-second/SHA256SUMS"
          cat "unsigned-${{ matrix.target }}-first/SHA256SUMS"

  sign-macos:
    needs: reproduce
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-darwin-arm64-first
          path: out/darwin-arm64/signed
      - name: sign and notarise
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$DEVELOPER_ID_PASSWORD" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$DEVELOPER_ID_PASSWORD" "$keychain"
          printf '%s' "$DEVELOPER_ID_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$DEVELOPER_ID_PASSWORD" "$keychain"
          cd out/darwin-arm64/signed
          rm -f SHA256SUMS
          codesign --force --options runtime --timestamp --sign "$DEVELOPER_ID_IDENTITY" tailscaled tailscale
          zip -q notarise.zip tailscaled tailscale
          xcrun notarytool submit notarise.zip --keychain-profile "$NOTARY_PROFILE" --wait
          rm notarise.zip
          codesign --verify --strict --verbose=2 tailscaled tailscale
      - uses: actions/upload-artifact@v4
        with:
          name: signed-darwin-arm64
          path: out/darwin-arm64/signed

  sign-windows:
    needs: reproduce
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-windows-amd64-first
          path: out/windows-amd64/signed
      - name: Authenticode
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/code-signing.pfx"
          cd out/windows-amd64/signed
          rm -f SHA256SUMS
          for f in tailscaled.exe tailscale.exe; do
            signtool sign //f "$RUNNER_TEMP/code-signing.pfx" //p "$WINDOWS_CERTIFICATE_PASSWORD" //fd SHA256 //tr http://timestamp.digicert.com //td SHA256 "$f"
            signtool verify //pa "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-amd64
          path: out/windows-amd64/signed

  publish:
    needs: [sign-macos, sign-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ vars.TAILSCALED_GO_VERSION }}
          cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
      - name: package, list the checksums for helpers.lock, write the licence report
        run: |
          set -euo pipefail
          for target in darwin-arm64 windows-amd64; do
            mkdir -p "out/$target"
            mv "signed-$target" "out/$target/signed"
            scripts/build-tailscaled.sh package "$target" out | tee -a out/pins.txt
          done
          scripts/build-tailscaled.sh licenses out
      - uses: actions/upload-artifact@v4
        with:
          name: tailscaled-release-files
          path: |
            out/tailscaled-*.tgz
            out/tailscaled-*.zip
            out/tailscale-licenses.txt
            out/pins.txt
      - name: attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/tailscaled-*.tgz out/tailscaled-*.zip out/tailscale-licenses.txt --clobber
