# Builds the desktop packages and the phone apps for a release and publishes it.
#
# release-please.yml opens the release pull request and, when it is merged, tags the release and
# creates its page as a draft. The tag push (vX.Y.Z) starts this workflow: it builds the packages
# for Linux (x86_64 and aarch64), macOS and Windows, checks each one with scripts/check-package.sh
# where it applies, and attaches them, with one SHA256SUMS, to the draft. The Most private helper
# (tailnet.yml) and the Flatpak (flatpak.yml) are built by their own workflows, called from here.
# The last job publishes the draft when every one of them has finished.
#
# Run by hand (workflow_dispatch) with an existing release tag (vX.Y.Z) in `tag` to build that
# tag and attach the files to its release. With `tag` empty it builds the chosen commit unsigned
# and keeps the files as workflow artifacts only; any other value fails. With `tag` empty and `sign`
# on it also runs the macOS signing jobs (in the protected release-signing environment, whatever
# MACOS_SIGNING says) and keeps the signed disk image as a workflow artifact: a dry run that
# touches no release.
#
# The GitHub App of release-please.yml also reads the release and uploads to it here: the
# RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY secrets.
#
# The builds never see a signing secret. They upload unsigned files; separate jobs in the
# protected release-signing environment download those files and only sign (and notarise) them,
# when the MACOS_SIGNING or WINDOWS_SIGNING repository variable is `true`. Without them the
# release carries the unsigned files (macOS signed ad hoc), as the local builds are. The Flatpak
# key is in that environment too. See docs/contribution/release.md for every secret and variable.
#
# The phone apps follow the same split as far as the platform allows.
#   Android: `android` builds the release APK and bundle for arm64, armv7 and x86_64, unsigned and
#   without a secret. `sign-android` (ANDROID_SIGNING) only signs the downloaded files with the
#   upload key and they go on the release. An unsigned APK cannot be installed, so without signing
#   nothing of Android goes on the release; the unsigned build stays as a workflow artifact.
#   iPhone: this is the one deviation. An iPhone build cannot be signed afterwards: Xcode makes the
#   certificate and the provisioning profile while it archives, with an App Store Connect API key,
#   and the profile carries the HealthKit entitlement. So `ios-testflight` (IOS_SIGNING) checks out
#   the tagged commit, builds, signs and uploads to TestFlight in one job of the release-signing
#   environment. The key reaches only the steps that need it, as step environment, never the job's
#   or a file in the workspace, and the job checks out no write token. The build is not attached to
#   the release: TestFlight is where the build goes, and without IOS_SIGNING nothing of iPhone is
#   built here at all (ci.yml builds it for the Simulator). The npm packages (installed with
#   scripts off), the interface and the crate sources are fetched and built before the key is
#   written. What still runs with the key on disk is the archive itself: Xcode's build phase
#   compiles the Rust crates, so their build scripts and procedural macros run then. The key's role
#   is App Manager, the narrowest that uploads builds; Xcode creating the first cloud-managed
#   distribution certificate may need Admin (see docs/contribution/release.md).
# Version codes are derived from the release version, with no counter: see docs/contribution/release.md.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag, vX.Y.Z, to build and attach to (empty: build unsigned, attach nothing)"
        required: false
        type: string
        default: ""
      sign:
        description: "With no tag: also sign, notarise and check the macOS disk image, and keep it as an artifact (touches no release)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # What to build and where the files go, for both triggers. A hand run accepts only an existing
  # release tag. Every job checks out the commit resolved here, never a name.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-app
    outputs:
      build: ${{ steps.plan.outputs.build }}
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
      helper: ${{ steps.plan.outputs.helper }}
      sign: ${{ steps.plan.outputs.sign }}
    steps:
      # A draft release is visible only to a token with write access, so this one needs contents
      # write. The job runs no code from the repository.
      - name: Get GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - id: plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SIGN: ${{ inputs.sign }}
        run: |
          set -euo pipefail
          tag=""
          if [ "$EVENT" = workflow_dispatch ]; then
            tag=$INPUT_TAG
          else
            tag=$PUSHED_TAG
          fi
          if [ -z "$tag" ]; then
            echo "no tag: building $GITHUB_SHA, attaching nothing (signing dry run: ${INPUT_SIGN:-false})"
            { echo "build=true"; echo "ref=$GITHUB_SHA"; echo "tag="; echo "sign=${INPUT_SIGN:-false}"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a release tag: $tag" >&2
            exit 1
          fi
          # Resolve the tag to its commit once; every job builds that commit, and publish checks
          # the tag still points at it. An annotated tag is peeled; a lightweight one is the commit.
          refs=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          sha=$(awk -v r="refs/tags/$tag^{}" '$2 == r { print $1 }' <<< "$refs")
          [ -n "$sha" ] || sha=$(awk -v r="refs/tags/$tag" '$2 == r { print $1 }' <<< "$refs")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "no such tag: $tag" >&2; exit 1; }
          # The commit must already be on main: a tag on a side branch is never built or signed.
          mainsha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          onmain=$(gh api "repos/$GITHUB_REPOSITORY/compare/$mainsha...$sha" --jq .status)
          case "$onmain" in
            identical | behind) ;;
            *) echo "$sha is not on main (compare says $onmain)" >&2; exit 1 ;;
          esac
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null \
            || { echo "no release for $tag" >&2; exit 1; }
          echo "$tag is $sha"
          { echo "build=true"; echo "ref=$sha"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
          # The Most private helper ships only once helpers.lock pins its licence tool and address.
          if gh api "repos/$GITHUB_REPOSITORY/contents/helpers.lock?ref=$sha" --jq .content \
            | base64 -d | grep -q PLACEHOLDER; then
            echo "helper=false" >> "$GITHUB_OUTPUT"
          else
            echo "helper=true" >> "$GITHUB_OUTPUT"
          fi

  # Each architecture is built natively on its own runner; scripts/package.sh builds for the
  # machine it runs on.
  linux:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' }}
    name: linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential curl file \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libdbus-1-dev rpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Rust
        run: rustup toolchain install
      - name: build the AppImage, deb and rpm
        run: scripts/package.sh
      - name: check each package
        env:
          NOCTURNE_RELEASE: ${{ vars.NOCTURNE_RELEASE_STRICT == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          for f in target/package/*.AppImage target/package/*.deb target/package/*.rpm; do
            scripts/check-package.sh "$f"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            target/package/*.AppImage
            target/package/*.deb
            target/package/*.rpm
            target/package/SOURCES.txt
            target/package/SHA256SUMS

  macos:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Rust
        run: rustup toolchain install
      - name: build the app and the disk image (signed ad hoc)
        run: scripts/package.sh --config macos
      # The engine is checked against its manifest here, before any Developer ID signature
      # changes its bytes.
      - name: check the disk image
        env:
          NOCTURNE_RELEASE: ${{ vars.NOCTURNE_RELEASE_STRICT == 'true' && '1' || '0' }}
        run: scripts/check-package.sh target/package/*.dmg
      # The app goes to the signing job as a tar, which keeps its modes and links, with the
      # entitlements it is signed with.
      - name: the app for signing
        run: |
          set -euo pipefail
          mkdir -p target/sign
          tar -C target/package/macos -cf target/sign/Nocturne.app.tar Nocturne.app
          cp src-tauri/macos/Entitlements.plist src-tauri/macos/Engine.entitlements.plist target/sign/
          basename target/package/*.dmg > target/sign/dmg-name
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos
          if-no-files-found: error
          path: |
            target/package/*.dmg
            target/package/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-unsigned-app
          if-no-files-found: error
          path: target/sign

  # Only the downloaded app and the signing tools run here: no checkout, no build. A release tag
  # signs when MACOS_SIGNING is `true`; a hand run with no tag signs when `sign` is on (a dry
  # run: the signed image is kept as an artifact and no release is touched).
  sign-macos:
    needs: [plan, macos]
    if: >-
      ${{ !cancelled() && needs.macos.result == 'success'
      && ((needs.plan.outputs.tag != '' && vars.MACOS_SIGNING == 'true')
      || (needs.plan.outputs.tag == '' && needs.plan.outputs.sign == 'true')) }}
    runs-on: macos-15
    timeout-minutes: 90
    environment: release-signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-unsigned-app
          path: in
      # Notarises with an App Store Connect API key when MACOS_NOTARY_API_KEY is set, otherwise
      # with an Apple ID and an app-specific password; with neither the job fails.
      - name: sign with the Developer ID and notarise
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          NOTARY_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for need in DEVELOPER_ID_CERTIFICATE DEVELOPER_ID_PASSWORD DEVELOPER_ID_IDENTITY; do
            [ -n "${!need}" ] || { echo "MACOS_$need is not set" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/build.keychain-db"
          keypass=$(openssl rand -hex 24)
          cleanup() {
            security delete-keychain "$keychain" 2> /dev/null || true
            rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/AuthKey.p8"
          }
          trap cleanup EXIT

          # The notary credentials: an API key, or an Apple ID as the fallback.
          if [ -n "$NOTARY_API_KEY" ]; then
            if [ -z "$NOTARY_API_KEY_ID" ] || [ -z "$NOTARY_API_ISSUER_ID" ]; then
              echo "MACOS_NOTARY_API_KEY needs MACOS_NOTARY_API_KEY_ID and MACOS_NOTARY_API_ISSUER_ID" >&2
              exit 1
            fi
            (umask 077; printf '%s' "$NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8")
            auth=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID")
            echo "notarising with an App Store Connect API key"
          elif [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_TEAM_ID" ] && [ -n "$NOTARY_APP_PASSWORD" ]; then
            auth=(--apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_APP_PASSWORD")
            echo "notarising with an Apple ID and an app-specific password"
          else
            echo "no notary credentials: set MACOS_NOTARY_API_KEY (with _KEY_ID and _ISSUER_ID), or MACOS_NOTARY_APPLE_ID, _TEAM_ID and _APP_PASSWORD" >&2
            exit 1
          fi

          # A keychain of its own, on the search list so codesign finds the identity.
          security create-keychain -p "$keypass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keypass" "$keychain"
          keychains=()
          while IFS= read -r k; do keychains+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          printf '%s' "$DEVELOPER_ID_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keypass" "$keychain" > /dev/null
          security find-identity -v -p codesigning "$keychain" | grep -qF -- "$DEVELOPER_ID_IDENTITY" \
            || { echo "the certificate has no identity named like MACOS_DEVELOPER_ID_IDENTITY" >&2; exit 1; }

          # Submit a file, wait, and print the log of anything that is not accepted.
          notarise() {
            local result id status
            result=$(xcrun notarytool submit "$1" "${auth[@]}" --wait --timeout 60m --output-format json) || true
            echo "$result"
            id=$(jq -r '.id // empty' <<< "$result")
            status=$(jq -r '.status // empty' <<< "$result")
            if [ "$status" != Accepted ]; then
              echo "notarisation of $1 ended as '${status:-unknown}'" >&2
              [ -z "$id" ] || xcrun notarytool log "$id" "${auth[@]}" >&2 || true
              exit 1
            fi
          }

          mkdir -p work out
          tar -C work -xf in/Nocturne.app.tar
          app=work/Nocturne.app
          dmg=$(cat in/dmg-name)
          # Hardened runtime and a secure timestamp on everything, as notarisation requires.
          sign() { codesign --force --options runtime --timestamp --sign "$DEVELOPER_ID_IDENTITY" "$@"; }
          is_macho() { file -b "$1" | grep -q 'Mach-O'; }

          # Inside out: libraries and executables first, then the nested bundles they sit in,
          # deepest first, then the app. The engine's executables get the entitlement that lets
          # them load the backend libraries they fetch later, which carry another signature.
          while IFS= read -r -d '' f; do
            is_macho "$f" || continue
            if file -b "$f" | grep -q 'executable'; then
              sign --entitlements in/Engine.entitlements.plist "$f"
            else
              sign "$f"
            fi
          done < <(find "$app/Contents" -type f ! -path "$app/Contents/MacOS/*" -print0)
          while IFS= read -r -d '' b; do sign "$b"; done \
            < <(find "$app/Contents" -depth -type d \( -name '*.framework' -o -name '*.app' -o -name '*.xpc' \) -print0)
          # Other helpers beside the main program in Contents/MacOS.
          main=$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")
          while IFS= read -r -d '' f; do
            if is_macho "$f"; then sign --entitlements in/Engine.entitlements.plist "$f"; fi
          done < <(find "$app/Contents/MacOS" -type f ! -name "$main" -print0)
          sign --entitlements in/Entitlements.plist "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app" 2>&1 | grep -q 'audio-input' \
            || { echo "the app lost its entitlements" >&2; exit 1; }

          # The app is notarised and stapled on its own, so it still opens offline once dragged
          # out of the image; the image is notarised after.
          ditto -c -k --keepParent "$app" work/Nocturne.zip
          notarise work/Nocturne.zip
          xcrun stapler staple "$app"
          spctl --assess --type execute -vv "$app"

          stage=$(mktemp -d)
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -quiet -volname Nocturne -srcfolder "$stage" -ov -format UDZO "out/$dmg"
          sign "out/$dmg"
          notarise "out/$dmg"
          xcrun stapler staple "out/$dmg"
          xcrun stapler validate "out/$dmg"
          spctl --assess --type open --context context:primary-signature -vv "out/$dmg"
          (cd out && shasum -a 256 -- *.dmg > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-signed
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.tag == '' && 7 || 90 }}
          path: out

  # The signed image is checked again outside the signing environment.
  check-macos:
    needs: [plan, sign-macos]
    if: ${{ !cancelled() && needs.sign-macos.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-macos-signed
          path: signed
      - name: check the signed disk image
        env:
          NOCTURNE_RELEASE: ${{ vars.NOCTURNE_RELEASE_STRICT == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          (cd signed && shasum -a 256 -c SHA256SUMS)
          scripts/check-package.sh --no-manifest signed/*.dmg
          xcrun stapler validate signed/*.dmg
          spctl --assess --type open --context context:primary-signature -vv signed/*.dmg
          # The app inside the image must pass Gatekeeper as the person's Mac will see it.
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" signed/*.dmg
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          spctl --assess --type execute -vv "$mnt"/Nocturne.app
          xcrun stapler validate "$mnt"/Nocturne.app
          codesign --verify --deep --strict --verbose=2 "$mnt"/Nocturne.app

  windows:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The scripts call python3, which Python on Windows does not provide by that name.
      - name: python3 on the path
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$RUNNER_TEMP/bin/python3"
          chmod +x "$RUNNER_TEMP/bin/python3"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Rust
        run: rustup toolchain install
      - name: build the NSIS and MSI installers
        run: scripts/package.sh --config windows
      # scripts/check-package.sh reads Linux and macOS packages only; the installers are checked
      # against their sums.
      - name: check the installers
        shell: pwsh
        run: |
          Set-Location target/package/windows
          Get-Content SHA256SUMS | ForEach-Object {
            $sum, $name = $_ -split '\s+\*?', 2
            if ((Get-FileHash -Algorithm SHA256 $name).Hash.ToLower() -ne $sum) { throw "sha256 mismatch: $name" }
            Write-Output "ok    $name"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows
          if-no-files-found: error
          path: |
            target/package/windows/*.exe
            target/package/windows/*.msi
            target/package/windows/SHA256SUMS

  # Only the downloaded installers and signtool run here: no checkout, no build. The installers
  # are signed; the program inside them is not, because signing it would mean building here.
  sign-windows:
    needs: [plan, windows]
    if: >-
      ${{ !cancelled() && needs.windows.result == 'success' && needs.plan.outputs.tag != ''
      && vars.WINDOWS_SIGNING == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 30
    environment: release-signing
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-windows
          path: out
      - name: Authenticode
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          cd out
          sha256sum -c SHA256SUMS
          printf '%s' "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/code-signing.pfx"
          for f in *.exe *.msi; do
            signtool sign //f "$RUNNER_TEMP/code-signing.pfx" //p "$WINDOWS_CERTIFICATE_PASSWORD" //fd SHA256 \
              //tr http://timestamp.digicert.com //td SHA256 "$f"
            signtool verify //pa "$f"
          done
          rm "$RUNNER_TEMP/code-signing.pfx"
          sha256sum -- *.exe *.msi > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-signed
          if-no-files-found: error
          path: out

  # The phone app for Android, unsigned: the APK and the bundle for arm64, armv7 and x86_64
  # (`make phone/android-release`, which refuses a dev-loopback build). It sees no secret.
  android:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Rust
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: build the release APK and bundle
        run: make ui/install phone/android-release
      # The version code is the release version's, by the formula Tauri documents:
      # major * 1000000 + minor * 1000 + patch. A tag that is not the app's version fails here.
      - name: the files for signing
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./ui/package.json').version")
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "the tag $TAG is not the app version $version" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          expected=$((major * 1000000 + minor * 1000 + patch))
          code=$(sed -n 's/^tauri\.android\.versionCode=//p' phone/src-tauri/gen/android/app/tauri.properties)
          [ "$code" = "$expected" ] || { echo "version code $code, expected $expected" >&2; exit 1; }
          echo "version $version, version code $code"
          one() {
            local found=()
            mapfile -t found < <(find phone/src-tauri/gen/android/app/build/outputs -name "$1")
            [ "${#found[@]}" -eq 1 ] || { echo "expected one $1, found ${#found[@]}" >&2; exit 1; }
            cp -- "${found[0]}" "$2"
          }
          mkdir -p target/android
          one '*-release-unsigned.apk' "target/android/Nocturne_${version}_android-unsigned.apk"
          one '*-release.aab' "target/android/Nocturne_${version}_android-unsigned.aab"
          (cd target/android && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phone-android-unsigned
          if-no-files-found: error
          path: target/android

  # Only the downloaded files, the runner's Android build tools and the JDK run here: no checkout,
  # no build. The upload key is RSA; the APK gets an APK signature (apksigner) and the bundle a
  # jar signature (jarsigner), which is what Google Play takes.
  sign-android:
    needs: [plan, android]
    if: >-
      ${{ !cancelled() && needs.android.result == 'success' && needs.plan.outputs.tag != ''
      && vars.ANDROID_SIGNING == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phone-android-unsigned
          path: in
      - name: sign with the upload key
        env:
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          (cd in && sha256sum -c SHA256SUMS)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          [ -x "$apksigner" ] || { echo "no apksigner in the runner's build tools" >&2; exit 1; }
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$UPLOAD_KEYSTORE" | base64 --decode > "$keystore"
          mkdir out
          for f in in/*-unsigned.apk in/*-unsigned.aab; do
            name=$(basename "$f" | sed 's/-unsigned//')
            case "$name" in
              "Nocturne_${TAG#v}_android."*) ;;
              *) echo "$name is not the release $TAG" >&2; exit 1 ;;
            esac
            case "$f" in
              *.apk)
                "$apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
                  --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --v4-signing-enabled false \
                  --out "out/$name" "$f"
                "$apksigner" verify --verbose --print-certs "out/$name"
                ;;
              *.aab)
                cp -- "$f" "out/$name"
                jarsigner -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD \
                  -keypass:env KEY_PASSWORD "out/$name" "$KEY_ALIAS"
                verdict=$(jarsigner -verify "out/$name")
                grep -q 'jar verified' <<< "$verdict" || { echo "$verdict" >&2; exit 1; }
                ;;
            esac
          done
          rm -f "$keystore"
          (cd out && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phone-android-signed
          if-no-files-found: error
          path: out

  # The iPhone app, built, signed and uploaded to TestFlight in one job: see the header for why
  # this one cannot be split. Xcode's automatic signing makes the distribution certificate and the
  # profile through the App Store Connect API key (`-allowProvisioningUpdates` with the key, which
  # the Tauri CLI passes on when APPLE_API_* are set). The key file is written for the steps that
  # use it and removed at the end. The build number is the release version (CFBundleVersion in
  # Info.plist, which release-please moves), so a rerun of a tag already uploaded is refused by
  # App Store Connect as a duplicate rather than adding a second build.
  ios-testflight:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.tag != '' && vars.IOS_SIGNING == 'true' }}
    runs-on: macos-15
    timeout-minutes: 90
    environment: release-signing
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Rust
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add aarch64-apple-ios
      - name: the tag is the app version
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./ui/package.json').version")
          [ "$TAG" = "v$version" ] || { echo "the tag $TAG is not the app version $version" >&2; exit 1; }
      # Everything that installs or builds without the key comes first: the key is written only
      # when the next step is the Xcode archive. Install scripts are off, so no dependency runs
      # code at install time at all (the interface builds and the Tauri CLI runs without them).
      - name: interface dependencies and the interface
        run: |
          set -euo pipefail
          (cd ui && npm ci --ignore-scripts)
          make phone/ui
      - name: fetch the Rust crates
        run: cargo fetch --locked
      # altool looks for the key in this folder, by the key's id; the Tauri CLI reads the same file.
      - name: App Store Connect key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$API_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
      - name: build and sign the app
        env:
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8"
          make -o phone/ui phone/ios-release
      - name: check the build number
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          ipa=$(find phone/src-tauri/gen/apple/build -name '*.ipa')
          if [ -z "$ipa" ] || [ "$(wc -l <<< "$ipa")" -ne 1 ]; then
            echo "expected one ipa, found: $ipa" >&2
            exit 1
          fi
          echo "ipa=$ipa" >> "$GITHUB_ENV"
          unzip -p "$ipa" 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          for key in CFBundleShortVersionString CFBundleVersion; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$RUNNER_TEMP/Info.plist")
            echo "$key $value"
            [ "$value" = "${TAG#v}" ] || { echo "$key is not ${TAG#v}" >&2; exit 1; }
          done
          rm "$RUNNER_TEMP/Info.plist"
      - name: upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
      - name: remove the key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect"

  # The Most private helper ships beside the app, never inside a package. It signs, so it runs
  # only for a release tag.
  tailnet:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.tag != '' && needs.plan.outputs.helper == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/tailnet.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      ref: ${{ needs.plan.outputs.ref }}

  # The Flatpak is built and published to its own repository by flatpak.yml (AetherPak).
  flatpak:
    needs: plan
    if: ${{ !cancelled() && github.event_name == 'push' && needs.plan.outputs.tag != '' }}
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    uses: ./.github/workflows/flatpak.yml
    # A called workflow's job reads its environment's secrets (the Flatpak key) only when inherited.
    secrets: inherit
    with:
      ref: ${{ needs.plan.outputs.ref }}
      tag: ${{ needs.plan.outputs.tag }}
      channel: stable
      publish: true

  # A signing job that was asked for must have succeeded; one that was not runs as skipped, and the
  # unsigned files go up instead.
  publish:
    needs:
      - plan
      - linux
      - macos
      - sign-macos
      - check-macos
      - windows
      - sign-windows
      - android
      - sign-android
      - ios-testflight
    if: >-
      ${{ !cancelled() && needs.plan.outputs.tag != ''
      && needs.linux.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success'
      && needs.android.result == 'success'
      && (vars.MACOS_SIGNING != 'true' || needs.check-macos.result == 'success')
      && (vars.WINDOWS_SIGNING != 'true' || needs.sign-windows.result == 'success')
      && (vars.ANDROID_SIGNING != 'true' || needs.sign-android.result == 'success')
      && (vars.IOS_SIGNING != 'true' || needs.ios-testflight.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-app
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: desktop
      # The signed Android files, only when signing is on: the unsigned ones are never attached.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ vars.ANDROID_SIGNING == 'true' }}
        with:
          name: phone-android-signed
          path: phone/android
      - name: one SHA256SUMS for every package
        run: |
          set -euo pipefail
          mkdir out
          for platform in linux-x86_64 linux-aarch64 macos windows; do
            dir="desktop/desktop-$platform"
            [ -d "$dir-signed" ] && dir="$dir-signed"
            echo "$platform: $dir"
            (cd "$dir" && sha256sum -c SHA256SUMS)
            find "$dir" -type f ! -name SHA256SUMS ! -name SOURCES.txt -exec cp {} out/ \;
            # Each Linux build lists the source packages of its own AppImage's libraries.
            if [ -f "$dir/SOURCES.txt" ]; then cp "$dir/SOURCES.txt" "out/SOURCES-$platform.txt"; fi
          done
          # The landing site links to these fixed names (releases/latest/download/<name>). Each is a
          # copy of exactly one packaged file; the versioned originals stay. The Linux patterns
          # name the architecture as the bundler spells it (Nocturne_<v>_amd64.AppImage,
          # Nocturne_<v>_arm64.deb, Nocturne-<v>-1.aarch64.rpm), which no fixed name matches.
          one() {
            local name=$1 pattern=$2 found=()
            mapfile -t found < <(compgen -G "out/$pattern" || true)
            [ "${#found[@]}" -eq 1 ] || { echo "$name: expected one $pattern, found ${#found[@]}" >&2; exit 1; }
            cp -- "${found[0]}" "out/$name"
          }
          # The signed phone files keep their versioned names; there is no fixed name for them yet.
          if [ -d phone/android ]; then
            (cd phone/android && sha256sum -c SHA256SUMS)
            find phone/android -type f ! -name SHA256SUMS -exec cp {} out/ \;
          fi
          one Nocturne-macos-arm64.dmg '*.dmg'
          one Nocturne-windows-x64-setup.exe '*-setup.exe'
          one Nocturne-windows-x64.msi '*.msi'
          one Nocturne-linux-x86_64.AppImage '*_amd64.AppImage'
          one Nocturne-linux-amd64.deb '*_amd64.deb'
          one Nocturne-linux-x86_64.rpm '*.x86_64.rpm'
          one Nocturne-linux-aarch64.AppImage '*_aarch64.AppImage'
          one Nocturne-linux-arm64.deb '*_arm64.deb'
          one Nocturne-linux-aarch64.rpm '*.aarch64.rpm'
          (cd out && sha256sum -- * > SHA256SUMS)
          cat out/SHA256SUMS
      - name: Get GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      # Never replaces a file already on the release: a rebuild is not byte for byte the same.
      - name: attach to the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.ref }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "${ref%% *}" = tag ]; then
            now=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref#* }" --jq .object.sha)
          else
            now=${ref#* }
          fi
          [ "$now" = "$SHA" ] || { echo "$TAG moved from $SHA to $now; not uploading" >&2; exit 1; }
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY"

  # The release stays a draft until every file is attached and the Flatpak is published. A Flatpak
  # that was not asked for (a hand run) is skipped.
  finish:
    needs: [plan, publish, tailnet, flatpak]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.tag != '' && needs.publish.result == 'success'
      && (needs.tailnet.result == 'success' || needs.tailnet.result == 'skipped')
      && (needs.flatpak.result == 'success' || needs.flatpak.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-app
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          sparse-checkout: .github/release-notes
          persist-credentials: false
      - name: Get GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      # The first-open steps are added to the notes once, only for a platform that is not signed.
      # A rerun finds the marker and leaves the notes alone.
      - name: add the first-open steps to the notes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          MACOS_SIGNING: ${{ vars.MACOS_SIGNING }}
          WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          if grep -q '<!-- first-open -->' notes.md; then
            echo "first-open steps already in the notes"
            exit 0
          fi
          if [ "$MACOS_SIGNING" = true ] && [ "$WINDOWS_SIGNING" = true ]; then
            echo "both platforms are signed; no first-open steps"
            exit 0
          fi
          { echo; echo; cat .github/release-notes/first-open.md; } >> notes.md
          [ "$MACOS_SIGNING" = true ] || cat .github/release-notes/macos.md >> notes.md
          [ "$WINDOWS_SIGNING" = true ] || cat .github/release-notes/windows.md >> notes.md
          gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
      - name: publish the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
