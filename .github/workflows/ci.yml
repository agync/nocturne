# The quality gate on every pull request and every push to main.
#
# `make check` is the gate the git hooks and this workflow share (docs/contribution/building.md).
# It is `make lint` plus `make test`, and one runner would take the sum of all its parts, so the
# jobs below run the same Makefile targets in parallel. Together they cover everything `make check`
# does:
#
#   rust       rust/lint (rustfmt, clippy twice), rust/test (two runs), contract/check
#   ui         ui/lint, ui/test, scripts/test
#   tailnet    tailnet/test, which fails instead of skipping when the pinned Go is missing
#   hygiene    docs/check and `pre-commit run --all-files`
#
# Beyond `make check`, four jobs run what a pull request can break and the gate does not reach:
# `e2e` (ui/e2e, the browser tests against the mock engine), `site` (the landing page and the
# docs built into one site and checked with axe, as docs/contribution/website.md describes), and
# the tests on the other machines Nocturne ships for:
#
#   rust-platforms  rust/test on Linux arm64; the workspace tests on macOS arm64 and Windows x64,
#                   and the real engine started on Windows
#   ui-platforms    the interface's unit tests on macOS and Windows
#
# A pull request that touches what the packages are built from also builds them, on the platforms
# release.yml builds on, unsigned and with nothing uploaded:
#
#   changes             decides from the changed paths whether the three jobs below run
#   package-linux       scripts/package.sh and scripts/check-package.sh on Ubuntu 24.04, x86_64
#   package-macos       scripts/package.sh --config macos and the disk image check on macOS 15
#   package-windows     scripts/package.sh --config windows under Git Bash, and the installer sums
#
# Not run here, on purpose, and listed again in the run summary:
#   e2e-real, e2e-online, e2e-models  need the real models, about 4.8 GB or more to download
#   smoke, netcheck*                  need a virtual display and a network namespace
#   Linux arm64 package               release.yml builds it on its own runner
#
# The workflow holds no secret and never runs pull request code with a write token: it uses
# `pull_request`, not `pull_request_target`, so Dependabot and fork pull requests are checked too.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels the run before it. A run on main always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Smaller build outputs, so the cache holds one copy and not several.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  NODE_VERSION: "22"
  # The system libraries the Tauri crates link against, as release.yml installs them.
  APT_PACKAGES: >-
    build-essential curl file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
    librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          read -ra packages <<< "$APT_PACKAGES"
          sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"
      - name: Rust
        run: rustup toolchain install
      # The registry is small and cached on every run. The build output is big, so it is saved
      # from main only and a pull request restores it.
      - name: Restore the Cargo caches
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Lint
        run: make rust/lint
      - name: Test
        run: make rust/test
      # Regenerates the TypeScript bindings and fails when the committed ones are stale.
      - name: Contract drift
        run: make contract/check
      - name: Save the Cargo caches
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

  # The Rust tests on the other machines Nocturne ships for. Linux on Arm runs both test runs of
  # rust/test; macOS and Windows run the workspace tests, since the server is built for Linux only.
  # Tests that need a Linux-only piece (/proc, network namespaces, prctl) are compiled out or
  # ignored with their reason elsewhere. Lint, the bindings and the browser tests stay on x86_64.
  rust-platforms:
    name: rust tests (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    # A cold build and every test take about fifteen minutes; a hung test fails the job soon after.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux arm64
            runs-on: ubuntu-24.04-arm
          - name: macos arm64
            runs-on: macos-15
          - name: windows x64
            runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      # The tests compare checked-in files byte for byte, and the repository's files end lines
      # with LF; Git for Windows would otherwise check them out with CRLF.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          read -ra packages <<< "$APT_PACKAGES"
          sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"
      - name: Rust
        run: rustup toolchain install
      # As in the rust job, but one cache per platform: the key names the architecture too.
      - name: Restore the Cargo caches
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-${{ runner.arch }}-
      # Every test target is built first, so a compile error in one does not hide another's, and
      # every test runs, so one failure does not hide the next.
      - name: Build the tests
        run: cargo build --workspace --tests --keep-going
      - name: Test
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            make rust/test
          else
            cargo test --workspace --no-fail-fast
          fi
      # The packaged engine itself, started as the app starts it. The tests above use a stand-in,
      # which cannot show what the real engine needs from Windows. The download is kept per
      # lemonade.lock and the script; scripts/fetch-lemonade.sh skips it when its stamp matches.
      - name: Restore the engine download
        id: engine-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/lemonade/windows-x86_64
          key: lemonade-windows-x86_64-${{ hashFiles('lemonade.lock', 'scripts/fetch-lemonade.sh') }}
      - name: Start the real engine
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          scripts/fetch-lemonade.sh
          NOCTURNE_LEMOND=vendor/lemonade/windows-x86_64 cargo test -p nocturne-lemonade \
            --test real -- --ignored --exact the_real_engine_starts_with_what_the_app_gives_it \
            | tee engine-test.log
          grep -q "test result: ok. 1 passed" engine-test.log
      - name: Save the engine download
        if: >-
          runner.os == 'Windows' && github.ref == 'refs/heads/main'
          && steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/lemonade/windows-x86_64
          key: lemonade-windows-x86_64-${{ hashFiles('lemonade.lock', 'scripts/fetch-lemonade.sh') }}
      - name: Save the Cargo caches
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

  ui:
    name: ui and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Lint
        run: make ui/lint
      - name: Test
        run: make ui/test
      # The packaging scripts' tests, which need only Python 3 and the interface's dependencies.
      - name: Packaging scripts
        run: make scripts/test

  # The interface's unit tests on a Mac and on Windows; lint and the type check stay on Linux.
  ui-platforms:
    name: ui tests (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos arm64
            runs-on: macos-15
          - name: windows x64
            runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: ui
    steps:
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Test
        run: npm test

  tailnet:
    name: tailnet helper
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Go version is the one the helper's go.mod pins, the same one tailnet.yml builds with.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helpers/tailnet/go.mod
          cache-dependency-path: helpers/tailnet/go.sum
      # With the variable set, a missing or different Go fails the job instead of skipping.
      - name: Vet and test, plain and with the release tags
        env:
          NOCTURNE_REQUIRE_TAILNET_TESTS: "1"
        run: make tailnet/test GO="$(command -v go)"

  hygiene:
    name: docs and hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The cargo-fmt hook runs rustfmt from the toolchain.
      - name: Rust
        run: rustup toolchain install
      - name: Install okf and pre-commit
        env:
          OKF_VERSION: "0.5.2"
          OKF_SHA256: 05ecf191f1ef1396cdeefa9a1fd877d491b32b91f2a4a4d06393656e880e90b6
        run: |
          set -euo pipefail
          archive="okf_${OKF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/okfcli/okf/releases/download/v${OKF_VERSION}/$archive"
          echo "$OKF_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --status -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.local/bin" okf
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 -m pip install --quiet pre-commit==4.7.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Docs bundle
        run: make docs/check
      - name: Hooks on every file
        run: pre-commit run --all-files --show-diff-on-failure

  e2e:
    name: browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui/install
      # Chromium only. The Playwright config adds its WebKit project only when WebKit is installed.
      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: Browser tests against the mock engine
        run: make ui/e2e
      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  site:
    name: site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui/install
      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ui
      # PODMAN points at nothing, so the docs are rendered by the pinned okf-wiki release that
      # site/toolchain.sh fetches and verifies, as the Cloudflare build does. No container image.
      - name: Build the site
        run: make site PODMAN=/nonexistent
      - name: Check the site
        run: |
          set -euo pipefail
          make site/serve > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:4180/ && break
            sleep 1
          done
          make -C site check
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-check
          path: site/build/check
          if-no-files-found: ignore
          retention-days: 7

  # Whether this run builds the packages. A push to main and a hand run always do; a pull request
  # does when it changes a path the packages are built from. The jobs that wait for the answer are
  # skipped otherwise, and the gate treats a skipped job as passed.
  changes:
    name: packaging paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packaging: ${{ steps.paths.outputs.packaging }}
      linux: ${{ steps.paths.outputs.linux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          packaging=true
          linux=true
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed"
            cat "$RUNNER_TEMP/changed"
            common='^(scripts/|src-tauri/bundle/|src-tauri/tauri[^/]*\.json$|src-tauri/Cargo\.toml$|Cargo\.lock$|ui/package[^/]*\.json$|lemonade\.lock$|helpers\.lock$|\.github/workflows/(release|ci)\.yml$)'
            packaging=false
            linux=false
            if grep -Eq "$common" "$RUNNER_TEMP/changed"; then
              packaging=true
              linux=true
            elif grep -Eq '^flatpak/' "$RUNNER_TEMP/changed"; then
              linux=true
            fi
          fi
          echo "packaging=$packaging linux=$linux"
          { echo "packaging=$packaging"; echo "linux=$linux"; } >> "$GITHUB_OUTPUT"

  # The three package jobs set up each platform as release.yml does, then run the same commands.
  # They sign nothing, upload nothing and read no secret. A package that builds here but fails
  # the release is a bug in this file, not in the package.
  package-linux:
    name: package (linux x86_64)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          read -ra packages <<< "$APT_PACKAGES"
          sudo apt-get install -y -qq --no-install-recommends "${packages[@]}" rpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Rust
        run: rustup toolchain install
      - name: Restore the Cargo caches
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/package
          key: cargo-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-package-${{ runner.os }}-${{ runner.arch }}-
      - name: build the AppImage, deb and rpm
        run: scripts/package.sh
      - name: check each package
        run: |
          set -euo pipefail
          for f in target/package/*.AppImage target/package/*.deb target/package/*.rpm; do
            scripts/check-package.sh "$f"
          done
      - name: Save the Cargo caches
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/package
          key: cargo-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

  package-macos:
    name: package (macos arm64)
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Rust
        run: rustup toolchain install
      - name: Restore the Cargo caches
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/package
          key: cargo-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-package-${{ runner.os }}-${{ runner.arch }}-
      - name: build the app and the disk image (signed ad hoc)
        run: scripts/package.sh --config macos
      - name: check the disk image
        run: scripts/check-package.sh target/package/*.dmg
      - name: Save the Cargo caches
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/package
          key: cargo-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

  package-windows:
    name: package (windows x64)
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The scripts call python3, which Python on Windows does not provide by that name.
      - name: python3 on the path
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$RUNNER_TEMP/bin/python3"
          chmod +x "$RUNNER_TEMP/bin/python3"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Rust
        run: rustup toolchain install
      - name: Restore the Cargo caches
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/package
          key: cargo-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-package-${{ runner.os }}-${{ runner.arch }}-
      - name: build the NSIS and MSI installers
        run: scripts/package.sh --config windows
      # scripts/check-package.sh reads Linux and macOS packages only; the installers are checked
      # against their sums.
      - name: check the installers
        shell: pwsh
        run: |
          Set-Location target/package/windows
          Get-Content SHA256SUMS | ForEach-Object {
            $sum, $name = $_ -split '\s+\*?', 2
            if ((Get-FileHash -Algorithm SHA256 $name).Hash.ToLower() -ne $sum) { throw "sha256 mismatch: $name" }
            Write-Output "ok    $name"
          }
      - name: Save the Cargo caches
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/package
          key: cargo-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

  # The one job to require in branch protection: it fails when any job above failed or was
  # cancelled, and it says what this workflow does not cover. A package job that was skipped
  # because no packaging path changed counts as passed.
  gate:
    name: gate
    if: always()
    needs:
      - rust
      - rust-platforms
      - ui
      - ui-platforms
      - tailnet
      - hygiene
      - e2e
      - site
      - changes
      - package-linux
      - package-macos
      - package-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
      - name: What this run did not cover
        if: always()
        run: |
          {
            echo "### Not run by ci.yml"
            echo
            echo "- Real-model runs (\`make e2e-real\`, \`e2e-online\`, \`e2e-models\`): they download the real models, about 4.8 GB or more. Run them locally."
            echo "- \`make smoke\` and \`make netcheck*\`: they need a virtual display and a network namespace."
            echo "- Linux arm64 packages: the release workflow builds them on their own runner. The Linux x86_64, macOS and Windows packages are built here when a pull request changes a packaging path."
          } >> "$GITHUB_STEP_SUMMARY"
