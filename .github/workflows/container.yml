# Builds the experimental server's container image (Containerfile, docs/adr/0012-server-mode.md)
# and, for a release tag, publishes it to the GitHub container registry as a manifest list.
#
# A pull request that touches the image's own files, and a push to main that touches what goes into
# it, only build it: no login, no push, and the token can only read. A release tag (vX.Y.Z) builds each architecture natively on its own runner,
# pushes it as <tag>-<arch>, and then puts both under <tag> and latest. release.yml may call this
# with `tag` and `ref` instead, as it calls tailnet.yml; the tag trigger should then be removed so
# a release publishes once.
#
# The image goes to the repository owner's namespace, where the built-in GITHUB_TOKEN can push, so
# no secret is needed. Set the IMAGE_NAME repository variable to publish elsewhere.
name: container

on:
  # A pull request builds the image only when the image's own files change. Code changes reach the
  # image through main, which builds it after every merge that touches what goes into it.
  pull_request:
    paths:
      - Containerfile
      - .containerignore
      - scripts/fetch-lemonade.sh
      - scripts/sha256.sh
      - .github/workflows/container.yml
  # Paths do not apply to tag pushes, so a release tag always builds and publishes.
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - Containerfile
      - .containerignore
      - Cargo.toml
      - Cargo.lock
      - helpers.lock
      - lemonade.lock
      - crates/**
      - src-tauri/**
      - ui/**
      - scripts/fetch-lemonade.sh
      - scripts/sha256.sh
      - .github/workflows/container.yml
  workflow_call:
    inputs:
      tag:
        description: "The release tag to publish as (empty: build only)"
        required: false
        type: string
        default: ""
      ref:
        description: "The commit to build, a full SHA (empty: the caller's commit)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# One publish of a tag at a time: both architectures and the manifest list write the same names.
# A push to main gets its own group, so no queued build of main is replaced by a newer one.
concurrency:
  group: container-${{ inputs.tag || (github.event_name == 'push' && github.ref_type == 'branch' && github.run_id) || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ${{ vars.IMAGE_NAME || 'ghcr.io/agync/nocturne' }}
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  # Pull requests, and a call without a tag: build each architecture and keep nothing.
  build:
    name: build ${{ matrix.arch }}
    if: ${{ !(inputs.tag || github.ref_type == 'tag') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: ${{ env.IMAGE }}
          tags: check-${{ matrix.arch }}
          containerfiles: Containerfile
          context: .
          # The docker format keeps the HEALTHCHECK, which OCI has no field for.
          oci: false

  # A release tag: build each architecture and push it under <tag>-<arch>.
  publish:
    name: publish ${{ matrix.arch }}
    if: ${{ inputs.tag || github.ref_type == 'tag' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: ${{ env.IMAGE }}
          tags: ${{ env.TAG }}-${{ matrix.arch }}
          containerfiles: Containerfile
          context: .
          oci: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}
      - uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          tags: ${{ steps.build.outputs.image-with-tag }}

  # Both architectures under <tag> and latest.
  manifest:
    name: manifest list
    needs: publish
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: assemble and push
        run: |
          set -euo pipefail
          for name in "$TAG" latest; do
            podman manifest create "$IMAGE:$name"
            for arch in amd64 arm64; do
              podman manifest add --arch "$arch" --os linux "$IMAGE:$name" "docker://$IMAGE:$TAG-$arch"
            done
            podman manifest push --all "$IMAGE:$name" "docker://$IMAGE:$name"
          done
          podman manifest inspect "$IMAGE:$TAG" \
            | python3 -I -c 'import json, sys; print(sorted(m["platform"]["os"] + "/" + m["platform"]["architecture"] for m in json.load(sys.stdin)["manifests"]))'
