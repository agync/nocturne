# Builds nocturne-tailnet (helpers/tailnet) for every platform, for Away from home (Most private).
# Run by hand, or called by release.yml with a release tag. Two independent builds must agree on
# every binary and the licence report must be written before the macOS and Windows ones are signed
# (in the release-signing environment); then all four are attached to the release, which never
# replaces a file.
name: tailnet

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "The release tag to build and attach to (empty: build the caller's commit, attach nothing)"
        required: false
        type: string
        default: ""
      ref:
        description: "The commit to build, a full SHA (empty: the caller's commit)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.copy }})
    strategy:
      fail-fast: true
      matrix:
        # The two copies run on different machines, in different folders.
        include:
          - copy: first
            runs-on: ubuntu-24.04
          - copy: second
            runs-on: ubuntu-22.04
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # helpers.lock is read with tomllib, which ubuntu-22.04's Python 3.10 lacks.
          python-version: "3.12"
      - id: pins
        name: pinned Go version (from helpers.lock)
        run: python3 -I -c 'import tomllib; l = tomllib.load(open("helpers.lock", "rb")); print("go=" + next(h for h in l["helpers"] if h["kind"] == "tailnet")["go_version"].removeprefix("go"))' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache: false
      - name: build
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/${{ matrix.copy }}"
          mkdir -p "$out"
          GO="$(command -v go)" scripts/build-tailnet.sh "$out" | tee "$out/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailnet-${{ matrix.copy }}
          path: ${{ runner.temp }}/${{ matrix.copy }}

  reproduce:
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tailnet-*
      - name: the two builds agree
        run: |
          set -euo pipefail
          for copy in first second; do
            (cd "tailnet-$copy" && sha256sum -c SHA256SUMS)
          done
          diff tailnet-first/SHA256SUMS tailnet-second/SHA256SUMS
          for f in tailnet-first/nocturne-tailnet-*; do
            cmp "$f" "tailnet-second/$(basename "$f")"
          done
          cat tailnet-first/SHA256SUMS

  # The licence report is written before anything is signed, so a module whose licence is not
  # known stops the release early.
  licenses:
    needs: reproduce
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # helpers.lock is read with tomllib, which ubuntu-22.04's Python 3.10 lacks.
          python-version: "3.12"
      - id: pins
        name: pinned versions (from helpers.lock)
        run: |
          python3 -I - >> "$GITHUB_OUTPUT" << 'PY'
          import tomllib
          lock = tomllib.load(open("helpers.lock", "rb"))
          helper = next(h for h in lock["helpers"] if h["kind"] == "tailnet")
          print("go=" + helper["go_version"].removeprefix("go"))
          print("licenses=" + helper["go_licenses_version"])
          PY
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache: false
      - name: write the licence report
        env:
          GO_LICENSES_VERSION: ${{ steps.pins.outputs.licenses }}
        run: |
          set -euo pipefail
          case "$GO_LICENSES_VERSION" in PLACEHOLDER*) echo "go-licenses is not pinned yet" >&2; exit 2 ;; esac
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/google/go-licenses@$GO_LICENSES_VERSION"
          tags=$(scripts/tailnet-tags.sh)
          cd helpers/tailnet
          for goos in linux darwin windows; do
            GOOS=$goos GOFLAGS="-tags=$tags" "$RUNNER_TEMP/bin/go-licenses" report .
          done | sort -u > ../../tailnet-licenses.txt
          test -s ../../tailnet-licenses.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailnet-licenses
          path: tailnet-licenses.txt

  sign-macos:
    needs: [reproduce, licenses]
    runs-on: macos-14
    # Signing secrets live only in this protected environment, which needs a maintainer's approval.
    environment: release-signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tailnet-first
          path: out
      # Notarises with an App Store Connect API key when MACOS_NOTARY_API_KEY is set, otherwise
      # with an Apple ID and an app-specific password; with neither the job fails.
      - name: sign and notarise
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          NOTARY_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for need in DEVELOPER_ID_CERTIFICATE DEVELOPER_ID_PASSWORD; do
            [ -n "${!need}" ] || { echo "MACOS_$need is not set" >&2; exit 1; }
          done
          cd out
          shasum -a 256 -c SHA256SUMS
          keychain="$RUNNER_TEMP/build.keychain-db"
          keypass=$(openssl rand -hex 24)
          cleanup() {
            security delete-keychain "$keychain" 2> /dev/null || true
            rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/AuthKey.p8"
          }
          trap cleanup EXIT

          if [ -n "$NOTARY_API_KEY" ]; then
            if [ -z "$NOTARY_API_KEY_ID" ] || [ -z "$NOTARY_API_ISSUER_ID" ]; then
              echo "MACOS_NOTARY_API_KEY needs MACOS_NOTARY_API_KEY_ID and MACOS_NOTARY_API_ISSUER_ID" >&2
              exit 1
            fi
            (umask 077; printf '%s' "$NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8")
            auth=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID")
          elif [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_TEAM_ID" ] && [ -n "$NOTARY_APP_PASSWORD" ]; then
            auth=(--apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_APP_PASSWORD")
          else
            echo "no notary credentials: set MACOS_NOTARY_API_KEY (with _KEY_ID and _ISSUER_ID), or MACOS_NOTARY_APPLE_ID, _TEAM_ID and _APP_PASSWORD" >&2
            exit 1
          fi

          # A keychain of its own, on the search list so codesign finds the identity.
          security create-keychain -p "$keypass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keypass" "$keychain"
          keychains=()
          while IFS= read -r k; do keychains+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          printf '%s' "$DEVELOPER_ID_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keypass" "$keychain" > /dev/null
          # The identity is read from the certificate unless MACOS_DEVELOPER_ID_IDENTITY names it.
          identities=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p')
          if [ -z "$DEVELOPER_ID_IDENTITY" ]; then
            if [ "$(grep -c . <<< "$identities")" -ne 1 ]; then
              echo "the certificate must hold exactly one Developer ID Application identity" >&2
              exit 1
            fi
            DEVELOPER_ID_IDENTITY=$identities
          fi
          grep -qxF -- "$DEVELOPER_ID_IDENTITY" <<< "$identities" \
            || { echo "the certificate has no identity named like MACOS_DEVELOPER_ID_IDENTITY" >&2; exit 1; }

          bin=nocturne-tailnet-macos-aarch64
          codesign --force --options runtime --timestamp --sign "$DEVELOPER_ID_IDENTITY" "$bin"
          zip -q "$RUNNER_TEMP/notarise.zip" "$bin"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" "${auth[@]}" --wait
          codesign --verify --strict --verbose=2 "$bin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-macos
          path: out/nocturne-tailnet-macos-aarch64

  sign-windows:
    needs: [reproduce, licenses]
    runs-on: windows-2022
    environment: release-signing
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tailnet-first
          path: out
      - name: Authenticode
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          cd out
          sha256sum -c SHA256SUMS
          printf '%s' "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/code-signing.pfx"
          bin=nocturne-tailnet-windows-x86_64.exe
          signtool sign //f "$RUNNER_TEMP/code-signing.pfx" //p "$WINDOWS_CERTIFICATE_PASSWORD" //fd SHA256 //tr http://timestamp.digicert.com //td SHA256 "$bin"
          signtool verify //pa "$bin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-windows
          path: out/nocturne-tailnet-windows-x86_64.exe

  publish:
    needs: [sign-macos, sign-windows]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tailnet-first
          path: unsigned
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signed-*
          path: signed
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tailnet-licenses
          path: out
      - name: collect the files, list the checksums for helpers.lock
        run: |
          set -euo pipefail
          (cd unsigned && sha256sum -c SHA256SUMS)
          mkdir -p out
          cp unsigned/nocturne-tailnet-linux-* out/
          cp signed/nocturne-tailnet-macos-aarch64 signed/nocturne-tailnet-windows-x86_64.exe out/
          cd out
          for f in nocturne-tailnet-*; do
            printf '%s  %s  %s\n' "$(sha256sum "$f" | cut -d ' ' -f 1)" "$f" "$(stat -c %s "$f")"
          done | tee ../pins.txt
          test "$(wc -l < ../pins.txt)" -eq 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailnet-release-files
          path: |
            out/nocturne-tailnet-*
            out/tailnet-licenses.txt
            pins.txt
      - name: attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "${ref%% *}" = tag ]; then
            now=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref#* }" --jq .object.sha)
          else
            now=${ref#* }
          fi
          [ "$now" = "$SHA" ] || { echo "$TAG is $now, not the built $SHA; not uploading" >&2; exit 1; }
          gh release upload "$TAG" out/nocturne-tailnet-* out/tailnet-licenses.txt --repo "$GITHUB_REPOSITORY"
