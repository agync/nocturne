# Weekly dependency updates, one pull request per ecosystem for the minor and patch versions, so a
# bump arrives as a decision and not as a stream of notifications. A new major version gets a pull
# request of its own, because it is the one that can break something.
#
# Every title starts with chore(deps) or ci(deps), which release-please does not count as a
# release, so a bump never moves the version or fills the release notes. Dependabot pull requests
# run ci.yml with the read-only token and no secret, which is all that workflow needs.
#
# What Dependabot cannot see is listed in docs/contribution/pin-bumps.md: the engine pin, the
# container digest in flatpak.yml, the Flatpak runtime, the docs renderer, the pinned Go toolchain
# and the helper pins. The days are staggered so the runs of ci.yml do not queue behind each other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      rust-crates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    ignore:
      # The types must match the Node major that ci.yml and release.yml run (see pin-bumps.md).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      ui-packages:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: "/helpers/tailnet"
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      tailnet-modules:
        patterns: ["*"]
        update-types: [minor, patch]
