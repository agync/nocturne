[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nocturne"
version = "0.1.0"
description = "A local AI that remembers the day, forgets what does not matter, and prints a morning paper."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Arun Babu Neelicattu" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nocturne = "nocturne.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nocturne"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
