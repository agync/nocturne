<html lang="en-GB">
<head>

<title>Control chips · setup box</title>
<!--
  Static mockup for docs/design/control-chips.md. One file: the colour tokens are copied from
  ui/src/design/tokens.css. The fonts load from ui/node_modules after `make ui/install`; without
  them the page falls back to Georgia and the system sans. Add ?theme=dark or ?theme=light.
-->
<style>
@font-face {
  font-family: "Newsreader";
  font-style: normal;
  font-weight: 200 800;
  src: url("../../../../ui/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2") format("woff2-variations");
}
@font-face {
  font-family: "IBM Plex Sans";
  font-weight: 400;
  src: url("../../../../ui/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2") format("woff2");
}
@font-face {
  font-family: "IBM Plex Sans";
  font-weight: 500;
  src: url("../../../../ui/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2") format("woff2");
}
@font-face {
  font-family: "IBM Plex Mono";
  font-weight: 500;
  src: url("../../../../ui/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
}

:root,
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #EEEBE4;
  --sheet: #FBFAF6;
  --raised: #FFFFFF;
  --ink: #17181C;
  --ink2: #4A4B50;
  --ink3: #66645E;
  --rule: #DAD5CA;
  --rule2: #17181C;
  --accent: #2C4BCF;
  --accent-soft: #E3E7F8;
  --ember: #A8402A;
  --marker: #F2D488;
  --focus: #2C4BCF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E1014;
    --sheet: #16191F;
    --raised: #1E222A;
    --ink: #ECE8DF;
    --ink2: #ABA79E;
    --ink3: #8A877F;
    --rule: #2A2E37;
    --rule2: #ECE8DF;
    --accent: #9DB0FF;
    --accent-soft: #1E2640;
    --ember: #EE8C6F;
    --marker: #5C4A18;
    --focus: #9DB0FF;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E1014;
  --sheet: #16191F;
  --raised: #1E222A;
  --ink: #ECE8DF;
  --ink2: #ABA79E;
  --ink3: #8A877F;
  --rule: #2A2E37;
  --rule2: #ECE8DF;
  --accent: #9DB0FF;
  --accent-soft: #1E2640;
  --ember: #EE8C6F;
  --marker: #5C4A18;
  --focus: #9DB0FF;
}
:root {
  --font-serif: "Newsreader", Georgia, serif;
  --font-sans: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px;
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
  --e0: inset 0 0 0 1px var(--rule);
  --e2: 0 18px 48px -12px rgba(23,24,28,.28), 0 0 0 1px rgba(23,24,28,.08);
  --size-control: 2.5rem;
}

*, *::before, *::after { box-sizing: border-box; }
h1, h2, p, figure { margin: 0; }
ul { margin: 0; padding: 0; }
body {
  margin: 0;
  padding: var(--s-6);
  background: var(--bg);
  color: var(--ink);
  font: 400 0.9375rem / 1.47 var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

/* ---------- App type and parts, as in ui/src ---------- */

.t-page-title {
  font: 400 2.5rem / 1.1 var(--font-serif);
  letter-spacing: -0.015em;
}
.t-section {
  font: 500 0.75rem / 1.33 var(--font-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.card {
  display: flex;
  flex-direction: column;
  gap: var(--s-4);
  width: 720px;
  padding: var(--s-7);
  border-radius: var(--r-lg);
  background: var(--sheet);
  box-shadow: var(--e2);
}
.eyebrow { color: var(--ink2); }
.title { max-width: 28ch; }
.tiers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-2); }
.tier { display: flex; flex-direction: column; gap: 2px; padding: var(--s-3) var(--s-4); border: 2px solid transparent; border-radius: var(--r-md); box-shadow: var(--e0); }
.tier.off { padding: calc(var(--s-3) + 1px) calc(var(--s-4) + 1px); border: 1px dashed var(--rule); box-shadow: none; color: var(--ink3); }
.tier.on { border-color: var(--accent); background: var(--accent-soft); }
.tierName { font-weight: 500; }
.tierDetail { color: var(--ink2); font: 400 0.8125rem / 1.38 var(--font-sans); }
.tier.off .tierDetail { color: var(--ink3); }
.lead { color: var(--ink2); }
.foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); }
.button {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: var(--size-control); padding: 0 var(--s-4);
  border: 1px solid transparent; border-radius: var(--r-sm); background: transparent;
  color: var(--ink); font: 500 0.875rem / 1.3 var(--font-sans);
}
.button.primary { background: var(--ink); color: var(--sheet); }
.button.quiet { padding: 0 var(--s-3); margin-inline-start: calc(-1 * var(--s-3)); color: var(--accent); }
svg.icon { flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* Before: the tiny line as built (inline style in Choosing.tsx). */
.tinyBefore { padding-top: var(--s-4); border-top: 1px solid var(--rule); color: var(--ink); }

/* ---------- Proposed ---------- */

/* The box: two short paragraphs, a 60ch measure and 1.5 line height. */
.later {
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
  padding-top: var(--s-4);
  border-top: 1px solid var(--rule);
}
.later p { max-width: 60ch; line-height: 1.5; color: var(--ink); }
.later .where { color: var(--ink2); }

/* A control chip: the control's own icon and words, framed as a reference, never as a button. */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0 6px;
  border: 1px solid var(--rule);
  border-radius: var(--r-sm);
  background: var(--bg);
  color: var(--ink);
  font-weight: 500;
  line-height: 1.4;
  white-space: nowrap;
  vertical-align: baseline;
  cursor: default;
}
.chip svg.icon { width: 14px; height: 14px; }

/* The disclosure: a chevron before the words, pointing right when shut and down when open. */
.disclosure .chev { transform: rotate(-90deg); }
.disclosure[aria-expanded="true"] .chev { transform: none; }

.why { max-width: 60ch; color: var(--ink2); line-height: 1.5; display: flex; flex-direction: column; gap: var(--s-2); }
.why ul { list-style: none; display: grid; grid-template-columns: max-content max-content; gap: 2px var(--s-5); color: var(--ink); }

/* ---------- Mockup frame ---------- */

.head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--s-5); color: var(--ink2); }
.head strong { color: var(--ink); font-weight: 500; }
.pair { display: flex; gap: var(--s-6); align-items: flex-start; }
figcaption { margin-bottom: var(--s-3); color: var(--ink2); }
figcaption b { color: var(--ink); font-weight: 500; }
.mark { outline: 2px dashed var(--marker); outline-offset: 6px; border-radius: 2px; }
.extras { display: flex; gap: var(--s-6); margin-top: var(--s-6); align-items: flex-start; }
.mini { width: 720px; padding: var(--s-5) var(--s-7); border-radius: var(--r-lg); background: var(--sheet); box-shadow: var(--e2); display: flex; flex-direction: column; gap: var(--s-4); }
.leads { display: grid; grid-template-columns: 1fr 1.4fr; gap: var(--s-5); align-items: start; }
.railFoot { display: flex; justify-content: space-between; gap: var(--s-2); padding: var(--s-2) 6px; border-radius: var(--r-md); background: var(--bg); }
.railLink { display: inline-flex; align-items: center; gap: var(--s-2); min-height: var(--size-control); padding: 0 var(--s-2); color: var(--ink2); font-size: 0.875rem; }
.railLink.current { background: var(--sheet); color: var(--ink); font-weight: 500; box-shadow: 0 0 0 1px var(--rule); border-radius: 6px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); padding: var(--s-3) 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.rowText { display: flex; flex-direction: column; gap: 2px; }
.rowLabel { font: 500 0.9375rem / 1.4 var(--font-sans); }
.rowHint { color: var(--ink2); font: 400 0.8125rem / 1.38 var(--font-sans); }
.rowValue { color: var(--ink2); }
.note { color: var(--ink3); font-size: 0.8125rem; }
</style>
</head>

<header class="head">

<div class="pair">

        <span class="button quiet">Why this one?</span>

  <figure>
    <figcaption><b>After</b> · proposed</figcaption>
    <section class="card">
      <p class="t-section eyebrow">Step 1 of 3 · This computer</p>
      <h1 class="t-page-title title">Nocturne will use its lightest mind. Everything works, but answers are simpler and it may miss details.</h1>
      <div class="tiers">
        <div class="tier off"><span class="tierName">Large</span><span class="tierDetail">For computers with 60 GB memory or more · 27 GB download · fastest</span><span class="tierDetail">Too big for this computer’s memory</span></div>

<script>
  const theme = new URLSearchParams(location.search).get("theme");
  if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
  const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.getElementById("themeName").textContent = dark ? "dark" : "light";
</script>
