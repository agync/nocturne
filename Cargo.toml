[workspace]
resolver = "3"
members = ["crates/*", "src-tauri", "phone/src-tauri", "phone/plugins/*"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "Apache-2.0"
# The oldest compiler that builds a release: the Flatpak SDK's rust-stable extension.
rust-version = "1.98"

[workspace.dependencies]
nocturne-contract = { path = "crates/contract" }
nocturne-engine = { path = "crates/engine" }
nocturne-intelligence = { path = "crates/intelligence" }
nocturne-lemonade = { path = "crates/lemonade" }
nocturne-mind = { path = "crates/mind" }
nocturne-provider = { path = "crates/provider" }
nocturne-helpers = { path = "crates/helpers" }
nocturne-channel = { path = "crates/channel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-compat"] }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
rusqlite = { version = "0.43", features = ["bundled"] }
jiff = "1.0"
sha2 = "0.11"
# The TLS provider is ring everywhere (see the rustls lines in the crates that make clients), so
# the binary links one crypto stack, not ring and aws-lc-rs.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
tauri = "2"
tauri-build = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
tracing-appender = "0.2"
base64 = "0.23"
# Shared with nocturne-channel, whose key and frame types the shell uses.
p256 = { version = "0.14", features = ["ecdh"] }
zeroize = "1"
getrandom = "0.4"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
url = "2"
# canonicalize without Windows' verbatim prefix (\\?\C:\...), which other paths never have.
dunce = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
