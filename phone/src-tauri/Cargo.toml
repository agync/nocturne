[package]
name = "nocturne-phone"
description = "Nocturne on the phone: the app shell around the phone screens, the sealed channel and a memory of its own"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "nocturne_phone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nocturne-phone"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
nocturne-channel = { workspace = true, features = ["client"] }
nocturne-contract.workspace = true
nocturne-engine.workspace = true
nocturne-intelligence.workspace = true
nocturne-provider.workspace = true
rusqlite.workspace = true
dunce.workspace = true
tauri.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-nocturne-system = { path = "../plugins/system" }
tauri-plugin-nocturne-calendar = { path = "../plugins/calendar" }
tauri-plugin-nocturne-health = { path = "../plugins/health" }
tauri-plugin-nocturne-speech = { path = "../plugins/speech" }
jiff.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[dev-dependencies]
nocturne-engine = { workspace = true, features = ["fake"] }
nocturne-provider = { workspace = true, features = ["stand-in"] }
nocturne-mind.workspace = true
tempfile.workspace = true

[features]
default = []
# Reaches the computer at http://127.0.0.1:<NOCTURNE_DEV_LOOPBACK_PORT> (default 8799), through
# `adb reverse`. Debug builds for checks only: never in `default`, never in a release build; the
# release target fails when its marker is in the library.
dev-loopback = ["nocturne-channel/dev-loopback"]
# Set by `tauri build`: embed the interface instead of loading a dev server.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
